name: Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prüfen, ob Android-Projekt vorhanden ist
        id: check
        run: |
          if [ -f gradlew ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::Noch kein Android-Projekt (gradlew fehlt) – Build übersprungen."; fi

      - name: JDK 17 einrichten
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        if: steps.check.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Tests ausführen
        if: steps.check.outputs.present == 'true'
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Debug-APK bauen
        if: steps.check.outputs.present == 'true'
        run: ./gradlew assembleDebug

      - name: APK als Artifact hochladen
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wetter-app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: GitHub Release erstellen (bei Tag v*)
        if: steps.check.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
