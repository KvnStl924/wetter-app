name: Android Build

# Push auf main: signierte APK bauen (Download unter "Artifacts").
# Tag vX.Y.Z: zusätzlich GitHub Release mit APK, Prüfsumme und Änderungstext –
# daraus holt sich der Update-Knopf der App die neue Version.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-Plattform installieren
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Signierschlüssel bereitstellen
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wetter-release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/wetter-release.jks" >> "$GITHUB_ENV"

      - name: Tests und APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Signatur prüfen und Datei benennen
        if: github.event_name != 'pull_request'
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i "sha-256"
          # Muss der feste Schlüssel sein, sonst nimmt Android kein Update an
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -qi "03ebd03964195c3099a4b2674dcc34ae5c32fa8ec3f455eb3f707a0122be2af0"
          VERSION=$(grep -oE 'val version(Major|Minor|Patch) = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' | paste -sd.)
          mkdir -p out
          cp "$APK" "out/Wetter-v$VERSION.apk"
          (cd out && sha256sum "Wetter-v$VERSION.apk" > "Wetter-v$VERSION.apk.sha256")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -l out

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: Wetter-v${{ steps.apk.outputs.version }}
          path: out/*
          retention-days: 30

      - name: GitHub Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG passt nicht zur Version $VERSION in app/build.gradle.kts"; exit 1
          fi
          # Änderungstext: Abschnitt dieser Version aus CHANGELOG.md
          awk -v v="## $VERSION" '$0 ~ "^## " {p = (index($0, v) == 1)} p' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "Version $VERSION" > notes.md
          gh release create "$TAG" out/* --title "Wetter $TAG" --notes-file notes.md
