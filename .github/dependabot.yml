# Dependabot ist AUSGESCHALTET (Kevin am 22.11.2026: App vorerst fertig, keine Update-Vorschläge mehr).
# open-pull-requests-limit: 0 = keine Vorschläge. Zum Wiedereinschalten die beiden Zeilen
# „open-pull-requests-limit: 0“ entfernen.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
